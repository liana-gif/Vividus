<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction Page</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f4f9;
    }
    .container {
        max-width: 800px;
        margin: 50px auto;
        padding: 20px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    h1 {
        text-align: center;
        color: #333;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }
    th, td {
        padding: 10px;
        text-align: left;
        border-bottom: 1px solid #ddd;
    }
    th {
        background-color: #f0f0f0;
        color: #333;
    }
    .btn {
        display: inline-block;
        margin: 10px 0;
        padding: 10px 15px;
        background-color: #007bff;
        color: #fff;
        text-decoration: none;
        border-radius: 5px;
        text-align: center;
    }
    .btn:hover {
        background-color: #0056b3;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Transaction Page</h1>
  <a href="#" class="btn">Add New Transaction</a>
  <table>
    <thead>
    <tr>
      <th>Transaction ID</th>
      <th>Date</th>
      <th>Amount</th>
      <th>Description</th>
    </tr>
    </thead>
    <tbody>
    <tr>
      <td>1</td>
      <td>2024-12-13</td>
      <td>$100.00</td>
      <td>Sample Transaction</td>
    </tr>
    <tr>
      <td>2</td>
      <td>2024-12-12</td>
      <td>$250.00</td>
      <td>Another Transaction</td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
