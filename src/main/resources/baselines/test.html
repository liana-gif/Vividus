<!DOCTYPE html>
<!-- verified by Liana -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .transaction-summary {
            margin-top: 20px;
            padding: 10px;
            background-color: #e9ecef;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Transaction Page</h1>
        <form id="transactionForm">
            <div class="form-group">
                <label for="account">Account Number</label>
                <input type="text" id="account" name="account" placeholder="Enter account number" required>
            </div>
            <div class="form-group">
                <label for="amount">Amount</label>
                <input type="number" id="amount" name="amount" placeholder="Enter amount" required>
            </div>
            <div class="form-group">
                <label for="transactionType">Transaction Type</label>
                <select id="transactionType" name="transactionType" required>
                    <option value="deposit">Deposit</option>
                    <option value="withdrawal">Withdrawal</option>
                </select>
            </div>
            <button type="submit">Submit</button>
        </form>
        <div id="summary" class="transaction-summary" style="display:none;">
            <h2>Transaction Summary</h2>
            <p id="summaryText"></p>
        </div>
    </div>

    <script>
        document.getElementById('transactionForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const account = document.getElementById('account').value;
            const amount = document.getElementById('amount').value;
            const transactionType = document.getElementById('transactionType').value;

            const summaryText = `Account: ${account} \nAmount: $${amount} \nTransaction Type: ${transactionType}`;
            
            document.getElementById('summaryText').textContent = summaryText;
            document.getElementById('summary').style.display = 'block';
        });
    </script>
</body>
</html>
